                                "params": {
                                    "box_id": "上报方类脑盒子标识符",
                                    "trajectory": "轨迹数据字典，包含 trajectory_id, device_id, waypoints, algorithm_name 等"
                                }
                            },
                            {
                                "func_name": "scan_drones",
